
<!DOCTYPE html>
<html lang="th">

        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid #eadfd2;
        }

        .version {
            text-align: center;
            margin-top: 24px;
            color: #777777;
        }
    </style>
</head>

</html>
